<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock ESP32 Shutter Tester</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="number"], input[type="text"], select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            margin-right: 10px;
        }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #6c757d; }
        button.secondary:hover { background-color: #545b62; }
        pre {
            background-color: #e9e9e9;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        .sensor-group { display: flex; gap: 10px; align-items: flex-end; }
        .sensor-group > div { flex-grow: 1; }
        .disabled-input { background-color: #e0e0e0; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mock ESP32 Shutter Tester</h1>

    <div>
        <label for="serverUrl">Server URL (e.g., http://localhost:5000):</label>
        <input type="text" id="serverUrl" value="http://localhost:5000">
    </div>

    <h2>Measurement Configuration</h2>
    <div>
        <label for="measurementMode">Measurement Mode:</label>
        <select id="measurementMode">
            <option value="ALL" selected>ALL SENSORS (Row)</option>
            <option value="OUTER">OUTER SENSORS (Outer)</option>
            <option value="INNER">INNER SENSOR (Inner)</option>
        </select>
    </div>

    <h2>Sensor Timestamps (microseconds)</h2>
    <div id="sensorInputs">
        <fieldset>
            <legend>Sensor 1</legend>
            <div class="sensor-group">
                <div>
                    <label for="s1_open">S1 Open (µs):</label>
                    <input type="number" id="s1_open" value="10000">
                </div>
                <div>
                    <label for="s1_close">S1 Close (µs):</label>
                    <input type="number" id="s1_close" value="26000">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Sensor 2</legend>
            <div class="sensor-group">
                <div>
                    <label for="s2_open">S2 Open (µs):</label>
                    <input type="number" id="s2_open" value="12000">
                </div>
                <div>
                    <label for="s2_close">S2 Close (µs):</label>
                    <input type="number" id="s2_close" value="28000">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Sensor 3</legend>
            <div class="sensor-group">
                <div>
                    <label for="s3_open">S3 Open (µs):</label>
                    <input type="number" id="s3_open" value="14000">
                </div>
                <div>
                    <label for="s3_close">S3 Close (µs):</label>
                    <input type="number" id="s3_close" value="30000">
                </div>
            </div>
        </fieldset>
    </div>

    <button onclick="sendShutterData()">Send Shutter Data</button>
    <button onclick="sendHeartbeat()" class="secondary">Send Heartbeat</button>

    <h2>Server Response:</h2>
    <pre id="responseArea">Awaiting data submission...</pre>
</div>

<script>
    const s1_open_in = document.getElementById('s1_open');
    const s1_close_in = document.getElementById('s1_close');
    const s2_open_in = document.getElementById('s2_open');
    const s2_close_in = document.getElementById('s2_close');
    const s3_open_in = document.getElementById('s3_open');
    const s3_close_in = document.getElementById('s3_close');
    const modeSelector = document.getElementById('measurementMode');
    const responseArea = document.getElementById('responseArea');
    const serverUrlInput = document.getElementById('serverUrl');

    function updateSensorInputsState() {
        const mode = modeSelector.value;
        
        // Enable all by default
        [s1_open_in, s1_close_in, s2_open_in, s2_close_in, s3_open_in, s3_close_in].forEach(input => {
            input.disabled = false;
            input.classList.remove('disabled-input');
        });

        if (mode === "OUTER") {
            s2_open_in.disabled = true;
            s2_close_in.disabled = true;
            s2_open_in.classList.add('disabled-input');
            s2_close_in.classList.add('disabled-input');
            // s2_open_in.value = "0"; // Optionally zero out
            // s2_close_in.value = "0";
        } else if (mode === "INNER") {
            s1_open_in.disabled = true;
            s1_close_in.disabled = true;
            s3_open_in.disabled = true;
            s3_close_in.disabled = true;
            s1_open_in.classList.add('disabled-input');
            s1_close_in.classList.add('disabled-input');
            s3_open_in.classList.add('disabled-input');
            s3_close_in.classList.add('disabled-input');
            // s1_open_in.value = "0";
            // s1_close_in.value = "0";
            // s3_open_in.value = "0";
            // s3_close_in.value = "0";
        }
    }

    modeSelector.addEventListener('change', updateSensorInputsState);
    // Initial call to set correct state based on default mode
    updateSensorInputsState();


    async function sendShutterData() {
        const serverUrl = serverUrlInput.value.trim();
        if (!serverUrl) {
            responseArea.textContent = "Error: Server URL is required.";
            return;
        }

        const mode = modeSelector.value;
        let s1_o = parseInt(s1_open_in.value) || 0;
        let s1_c = parseInt(s1_close_in.value) || 0;
        let s2_o = parseInt(s2_open_in.value) || 0;
        let s2_c = parseInt(s2_close_in.value) || 0;
        let s3_o = parseInt(s3_open_in.value) || 0;
        let s3_c = parseInt(s3_close_in.value) || 0;

        // Mimic ESP32 sending 0 for inactive sensors
        if (mode === "OUTER") {
            s2_o = 0;
            s2_c = 0;
        } else if (mode === "INNER") {
            s1_o = 0;
            s1_c = 0;
            s3_o = 0;
            s3_c = 0;
        }

        const payload = {
            mode: mode,
            s1_open: s1_o,
            s1_close: s1_c,
            s2_open: s2_o,
            s2_close: s2_c,
            s3_open: s3_o,
            s3_close: s3_c
        };

        responseArea.textContent = "Sending data...";

        try {
            const response = await fetch(`${serverUrl}/shutterdata`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const responseData = await response.json();
            responseArea.textContent = `Status: ${response.status}\n\n${JSON.stringify(responseData, null, 2)}`;
            if (!response.ok) {
                 console.error('Server error:', responseData);
            }

        } catch (error) {
            responseArea.textContent = `Error: ${error.message}\nIs the server running at ${serverUrl}?`;
            console.error('Fetch error:', error);
        }
    }

    async function sendHeartbeat() {
        const serverUrl = serverUrlInput.value.trim();
        if (!serverUrl) {
            responseArea.textContent = "Error: Server URL is required.";
            return;
        }
        responseArea.textContent = "Sending heartbeat...";
        try {
            const response = await fetch(`${serverUrl}/heartbeat/esp32`, {
                method: 'POST', // Or GET, as your server supports both
                headers: {
                    'Content-Type': 'application/json' // Good practice even for empty body
                },
                body: JSON.stringify({}) // Empty JSON object
            });
            const responseData = await response.json();
            responseArea.textContent = `Status: ${response.status}\n\n${JSON.stringify(responseData, null, 2)}`;
        } catch (error) {
            responseArea.textContent = `Error: ${error.message}\nIs the server running at ${serverUrl}?`;
            console.error('Fetch error:', error);
        }
    }
</script>

</body>
</html>

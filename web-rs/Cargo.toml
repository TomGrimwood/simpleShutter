[package]
name = "web-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4" }
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4.4" 
serde = { version = "1.0", features = ["derive"] }
async-stream = "0.3.6"
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
once_cell = "1.19" # For global AppState or similar lazy initialized statics.
futures-util = "0.3" # For StreamExt, e.g. with SSE
tokio-stream = "0.1" # Required by axum::response::sse
chrono = "0.4" # For potential timestamp formatting for logs, though not strictly required by problem

# Using std::sync::Mutex and Atomic for AppState where possible for simplicity.
# parking_lot can be a replacement for std::sync::Mutex if contention becomes an issue.